<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AnimeHub - Sign Up</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="signup.css">
</head>

<body class="auth-page">

    <main class="signup-page">

        <!-- Decorative background -->
        <div class="auth-orb auth-orb-one"></div>
        <div class="auth-orb auth-orb-two"></div>
        <div class="auth-grid"></div>

        <!-- Brand -->
        <a href="index.html" class="auth-logo">
            <span class="auth-logo-icon">👾</span>
            <span>Anime<span>Hub</span></span>
        </a>

        <!-- Signup card -->
        <section class="signup-card">

            <div class="signup-heading">

                <div class="signup-icon">🎌</div>

                <p class="auth-label">JOIN THE COMMUNITY</p>

                <h1>Create your <span>AnimeHub</span> account</h1>

                <p class="signup-subtitle">
                    Find your people. Share your anime world.
                </p>

            </div>


            <form class="signup-form">

                <div class="form-row">

                    <div class="form-group">

                        <label for="username">Username</label>

                        <div class="input-wrap">
                            <span>👤</span>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Choose a username"
                                autocomplete="username"
                                required
                            >
                        </div>

                    </div>


                    <div class="form-group">

                        <label for="email">Email</label>

                        <div class="input-wrap">
                            <span>✉</span>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Your email"
                                autocomplete="email"
                                required
                            >
                        </div>

                    </div>

                </div>


                <div class="form-group">

                    <label for="password">Password</label>

                    <div class="input-wrap">

                        <span>🔑</span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="password"
                            aria-label="Show password"
                        >👁</button>

                    </div>

                    <div class="password-strength">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <p class="password-hint">
                        Use at least 8 characters with a mix of letters and numbers.
                    </p>

                </div>


                <div class="form-group">

                    <label for="confirm-password">Confirm Password</label>

                    <div class="input-wrap">

                        <span>🔐</span>

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Repeat your password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirm-password"
                            aria-label="Show password"
                        >👁</button>

                    </div>

                </div>


                <label class="terms">

                    <input type="checkbox" required>

                    <span class="custom-checkbox"></span>

                    <span>
                        I agree to AnimeHub's
                        <a href="#">Terms of Service</a>
                        and
                        <a href="#">Privacy Policy</a>.
                    </span>

                </label>


                <button type="submit" class="signup-submit">

                    <span>Create My Account</span>

                    <strong>→</strong>

                </button>

            </form>


            <div class="auth-divider">
                <span>OR</span>
            </div>


            <div class="social-signup">

                <button type="button">
                    <span>G</span>
                    Continue with Google
                </button>

                <button type="button">
                    <span>𝕏</span>
                    Continue with X
                </button>

            </div>


            <p class="login-prompt">

                Already have an account?

                <a href="login.html">Log in</a>

            </p>

        </section>


        <p class="auth-footer">
            © 2026 AnimeHub · Made for anime fans 🎌
        </p>

    </main>


    <script src="signup.js"></script>

</body>
</html>
