<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AnimeHub - Login</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>

<body class="auth-page">

    <main class="login-page">

        <!-- Decorative background -->
        <div class="auth-orb auth-orb-one"></div>
        <div class="auth-orb auth-orb-two"></div>
        <div class="auth-grid"></div>

        <!-- Brand -->
        <a href="index.html" class="auth-logo">
            <span class="auth-logo-icon">👾</span>
            <span>Anime<span>Hub</span></span>
        </a>

        <!-- Login card -->
        <section class="login-card">

            <div class="login-heading">
                <div class="login-icon">🔐</div>

                <p class="auth-label">WELCOME BACK</p>

                <h1>Welcome back, <span>Otaku!</span></h1>

                <p class="login-subtitle">
                    Log in to continue your AnimeHub journey.
                </p>
            </div>

            <form class="login-form">

                <div class="form-group">
                    <label for="email">Email or Username</label>

                    <div class="input-wrap">
                        <span>👤</span>
                        <input
                            type="text"
                            id="email"
                            name="email"
                            placeholder="Enter your email or username"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <div class="password-label">
                        <label for="password">Password</label>
                        <a href="#">Forgot password?</a>
                    </div>

                    <div class="input-wrap">
                        <span>🔑</span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            aria-label="Show password"
                        >👁</button>
                    </div>
                </div>

                <label class="remember-me">
                    <input type="checkbox" name="remember">
                    <span class="custom-checkbox"></span>
                    <span>Remember me</span>
                </label>

                <button type="submit" class="login-submit">
                    <span>Login to AnimeHub</span>
                    <strong>→</strong>
                </button>

            </form>

            <div class="auth-divider">
                <span>OR</span>
            </div>

            <div class="social-login">
                <button type="button">
                    <span>G</span>
                    Continue with Google
                </button>

                <button type="button">
                    <span>𝕏</span>
                    Continue with X
                </button>
            </div>

            <p class="signup-prompt">
                New to AnimeHub?
                <a href="signup.html">Create an account</a>
            </p>

        </section>

        <p class="auth-footer">
            © 2026 AnimeHub · Made for anime fans 🎌
        </p>

    </main>


    <script src="login.js"></script>

</body>
</html>
